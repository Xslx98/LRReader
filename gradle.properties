# Project-wide Gradle settings.
# For more details: https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon. R8, lint and detekt's type resolution
# spend less time in GC with 4 GB (CI runners have 16 GB).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Reuse task outputs across builds and CI jobs (setup-gradle carries the
# cache between runs); :app and :benchmark build in parallel.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX only: no dependency uses the legacy support library (./gradlew checkJetifier).
android.useAndroidX=true
android.enableJetifier=false
android.overridePathCheck=true

# Namespace each library's R class to reduce R class size
android.nonTransitiveRClass=true

# Enable BuildConfig generation
android.defaults.buildfeatures.buildconfig=true

# Keep resource IDs final for binary compatibility
android.nonFinalResIds=false