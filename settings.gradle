pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }

}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
            // Only the GitHub-built com.github.* libraries come from JitPack; every
            // other group must never be looked up there (dependency confusion).
            content { includeGroupByRegex "com\\.github\\..*" }
        }
    }
}
rootProject.name = "LRReader"
include ':app'
