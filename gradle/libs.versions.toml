# Version Catalog — LRReader
# Ref: https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog-declaration

[versions]
# --- Build tools ---
agp = "8.13.2"
# Kotlin capped at 2.3.21: KSP latest (2.3.9, decoupled versioning since KSP 2.3.0)
# aligns with the Kotlin 2.3 line; Kotlin 2.4.0 support unconfirmed as of 2026-07.
# kotlin/ksp/room upgrade in lockstep: KSP 2.3.x is KSP2-only, Room needs >=2.7 for
# KSP2, and Room >=2.7 breaks under KSP1 (compiler-embedded serialization leak).
kotlin = "2.3.21"
ksp = "2.3.9"

# --- AndroidX ---
activity = "1.13.0"
appcompat = "1.7.1"
biometric = "1.1.0"
cardview = "1.0.0"
# Capped at 1.18.0: core-ktx 1.19+ requires compileSdk 37 and AGP 9.
core-ktx = "1.18.0"
fragment = "1.8.9"
lifecycle = "2.11.0"
paging = "3.5.0"
preference = "1.2.1"
recyclerview = "1.4.0"
room = "2.8.4"
test-core = "1.7.0"
# Perf tooling: :benchmark (Macrobenchmark + baseline profile generator) and
# the profile installer that AOTs sideloaded installs.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
test-ext-junit = "1.3.0"

# --- Google ---
material = "1.14.0"

# --- Kotlin/JetBrains ---
coroutines = "1.11.0"
serialization-json = "1.11.0"

# --- Third-party ---
detekt = "1.23.8"
okhttp = "4.12.0"
# Coil capped at 3.4.0: 3.5.0+ requires kotlin-stdlib 2.4.x (we are on 2.3.21).
# coil-network-okhttp 3.4.0 is built against OkHttp 4.12.0, our version.
coil = "3.4.0"
robolectric = "4.16.1"

# --- Test ---
junit = "4.13.2"
joor = "0.9.15"

# --- JitPack (no auto-upgrade) ---
# Pinned by tag or commit hash; Dependabot/Renovate cannot bump them.
# Track manually; see ROADMAP for fork plan.
advrecyclerview = "1.0.0"
spinkit = "1.4.0"

[libraries]
# --- AndroidX ---
activity = { module = "androidx.activity:activity", version.ref = "activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging" }
material = { module = "com.google.android.material:material", version.ref = "material" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "test-core" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }

# --- Kotlin ---
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }

# --- Third-party ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
advrecyclerview = { module = "com.h6ah4i.android.widget.advrecyclerview:advrecyclerview", version.ref = "advrecyclerview" }
spinkit = { module = "com.github.ybq:Android-SpinKit", version.ref = "spinkit" }

# --- Test ---
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
joor = { module = "org.jooq:joor", version.ref = "joor" }

# --- JitPack (no version.ref) ---
# drawerlayout and Pagination_Sxj are pinned by commit hash, the rest by tag.
# The tagged com.github.seven332 AARs are checked byte for byte against
# libs/seven332-backup/ in CI (scripts/ci/check-jitpack-aars.sh).
seven332-drawerlayout = { module = "com.github.seven332:drawerlayout", version = "ea2bb388f0" }
seven332-easyrecyclerview = { module = "com.github.seven332:easyrecyclerview", version = "0.1.1" }
seven332-refreshlayout = { module = "com.github.seven332:refreshlayout", version = "0.1.0" }
pagination-sxj = { module = "com.github.xiaojieonly:Pagination_Sxj", version = "8d2c34d8f53927aeaa1d405d8653969379cb37ec" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
