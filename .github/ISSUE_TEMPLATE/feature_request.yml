name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working in the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: dropdown
    id: server
    attributes:
      label: Does it need a LANraragi server feature?
      options:
        - "No, the app alone can do it"
        - "Yes, it depends on a server API"
        - "Not sure"
