name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main gets a full result: a later push used to cancel the
  # run of the commit before it (v1.25.0's release commit never finished CI).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Fastlane Supply Metadata
        uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2.0.0

  build:
    runs-on: ubuntu-latest

    # The gate scripts under scripts/ci/ are the same ones scripts/ci-check.sh
    # runs locally, so a push cannot go red on a check that was skipped there.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The baseline check diffs against the previous commit of a push.
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleAppReleaseDebug

      - name: Room schema must be committed
        # KSP rewrites app/schemas/<version>.json on every build; a diff here
        # means an entity changed without a version bump.
        run: bash scripts/ci/check-schemas.sh

      - name: Unit Tests
        run: ./gradlew app:testAppReleaseDebugUnitTest

      - name: Lint
        run: ./gradlew app:lintAppReleaseDebug

      - name: Lint and detekt baselines must not grow
        # New findings are fixed, not appended to a baseline. A push compares
        # with the commit before it (work lands by direct push, so a PR-only
        # check never ran); a PR compares with its base.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          bash scripts/ci/check-baselines.sh "$BASE"

      - name: Detekt
        run: ./gradlew detektMain

      - name: Verify Log.v/d/i/w stripped from release DEX
        # Enforces proguard-rules.pro's -assumenosideeffects on Log.v/d/i/w.
        # minifyAppReleaseReleaseWithR8 instead of assembleAppReleaseRelease:
        # CI has no signing keys, and this DEX is the one the signed APK ships.
        run: |
          ./gradlew :app:minifyAppReleaseReleaseWithR8
          bash scripts/ci/check-dex-logs.sh

      - name: Test Coverage
        run: ./gradlew app:jacocoTestReport
        continue-on-error: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports/detekt/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build/outputs/apk/

  dependency-submission:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Dependency Submission
        uses: mikepenz/gradle-dependency-submission@v1
        with:
          gradle-build-module: ":app"
