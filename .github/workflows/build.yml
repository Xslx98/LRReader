name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main gets a full result: a later push used to cancel the
  # run of the commit before it (v1.25.0's release commit never finished CI).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate Fastlane Supply Metadata
        uses: ashutoshgngwr/validate-fastlane-supply-metadata@c8857fdbbd3e00f9a5cbe8604bcecfa95ce8fef8 # v2.1.0

  build:
    runs-on: ubuntu-latest

    # The gate scripts under scripts/ci/ are the same ones scripts/ci-check.sh
    # runs locally, so a push cannot go red on a check that was skipped there.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline check diffs against the previous commit of a push.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleAppReleaseDebug

      - name: JitPack AARs must match the committed backups
        run: bash scripts/ci/check-jitpack-aars.sh

      - name: No new plain runCatching (it swallows coroutine cancellation)
        run: bash scripts/ci/check-runcatching.sh

      - name: Room schema must be committed
        # KSP rewrites app/schemas/<version>.json on every build; a diff here
        # means an entity changed without a version bump.
        run: bash scripts/ci/check-schemas.sh

      - name: Unit Tests
        run: ./gradlew app:testAppReleaseDebugUnitTest

      - name: Lint
        run: ./gradlew app:lintAppReleaseDebug

      - name: Lint and detekt baselines must not grow
        # New findings are fixed, not appended to a baseline. A push compares
        # with the commit before it (work lands by direct push, so a PR-only
        # check never ran); a PR compares with its base.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          bash scripts/ci/check-baselines.sh "$BASE"

      - name: Detekt
        run: ./gradlew detektMain

      - name: Verify Log.v/d/i/w stripped from release DEX
        # Enforces proguard-rules.pro's -assumenosideeffects on Log.v/d/i/w.
        # minifyAppReleaseReleaseWithR8 instead of assembleAppReleaseRelease:
        # CI has no signing keys, and this DEX is the one the signed APK ships.
        run: |
          ./gradlew :app:minifyAppReleaseReleaseWithR8
          bash scripts/ci/check-dex-logs.sh

      - name: Test Coverage
        run: ./gradlew app:jacocoTestReport
        continue-on-error: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: app/build/reports/jacoco/

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-reports
          path: app/build/reports/detekt/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Build
          path: ./app/build/outputs/apk/

  release-smoke:
    # Installs and runs the minified, signed release build on an x86_64
    # emulator (scripts/ci/smoke-release.sh). The unit tests above run the
    # debug build only; R8 keep-rule mistakes crash only the release build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build signed release with a throwaway key
        # The real signing key never leaves the maintainer's machine; this
        # APK exists only to be run on the emulator below.
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke \
            -keyalg RSA -keysize 2048 -validity 1 -storepass smokepass -keypass smokepass \
            -dname "CN=LRReader CI smoke"
          chmod +x ./gradlew
          RELEASE_STORE_FILE="$RUNNER_TEMP/smoke.jks" RELEASE_STORE_PASSWORD=smokepass \
            RELEASE_KEY_ALIAS=smoke RELEASE_KEY_PASSWORD=smokepass \
            ./gradlew :app:assembleAppReleaseRelease -PsmokeX86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run release smoke on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/smoke-release.sh app/build/outputs/apk/appRelease/release/app-appRelease-release.apk

  dependency-submission:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      # Gradle's own action replaces the third-party one that ran with
      # contents: write.
      - name: Dependency Submission
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
