name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main gets a full result: a later push used to cancel the
  # run of the commit before it (v1.25.0's release commit never finished CI).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate Fastlane Supply Metadata
        uses: ashutoshgngwr/validate-fastlane-supply-metadata@c8857fdbbd3e00f9a5cbe8604bcecfa95ce8fef8 # v2.1.0

  # The Gradle gates run as three parallel jobs (static / test / release-r8)
  # instead of one serial job; setup-gradle carries the Gradle build cache
  # between jobs and runs, so each job reuses compiled outputs. The gate
  # scripts under scripts/ci/ are the same ones scripts/ci-check.sh runs
  # locally, so a push cannot go red on a check that was skipped there.
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The baseline check diffs against the previous commit of a push.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleAppReleaseDebug

      - name: No new plain runCatching (it swallows coroutine cancellation)
        run: bash scripts/ci/check-runcatching.sh

      - name: Room schema must be committed
        # KSP rewrites app/schemas/<version>.json on every build (its tasks
        # never come from the build cache); a diff here means an entity
        # changed without a version bump.
        run: bash scripts/ci/check-schemas.sh

      - name: Lint
        run: ./gradlew app:lintAppReleaseDebug

      - name: Lint and detekt baselines must not grow
        # New findings are fixed, not appended to a baseline. A push compares
        # with the commit before it (work lands by direct push, so a PR-only
        # check never ran); a PR compares with its base.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          bash scripts/ci/check-baselines.sh "$BASE"

      - name: No crash-class lint ids baselined or suppressed without a reason
        # NewApi & co. flag code that throws on some devices; a baselined
        # NewApi hid an Android 9/10 crash (audit 2026-10-06d STAB-11).
        # Also fails on reasonless source suppressions of the same ids
        # (audit 2026-10-06e STAB-03).
        run: bash scripts/ci/check-lint-crash-ids.sh

      - name: Detekt
        run: ./gradlew detektMain

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-reports
          path: app/build/reports/detekt/

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-debug
          path: ./app/build/outputs/apk/

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew app:testAppReleaseDebugUnitTest

      - name: Coverage must not drop below the floor
        # Line coverage of dao / download / gallery and the framework against
        # scripts/ci/coverage-floor.txt (audit 2026-10-04 C47 / REL-23).
        run: |
          ./gradlew app:jacocoTestReport
          bash scripts/ci/check-coverage.sh

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: app/build/reports/jacoco/

  release-r8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build release with a throwaway key
        # The real signing key never leaves the maintainer's machine. The size
        # gate needs a packaged arm64 APK (zip layout, signing block); the DEX
        # gates below read the R8 output this build produces.
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/size.jks" -alias size \
            -keyalg RSA -keysize 2048 -validity 1 -storepass sizepass -keypass sizepass \
            -dname "CN=LRReader CI size"
          chmod +x ./gradlew
          RELEASE_STORE_FILE="$RUNNER_TEMP/size.jks" RELEASE_STORE_PASSWORD=sizepass \
            RELEASE_KEY_ALIAS=size RELEASE_KEY_PASSWORD=sizepass \
            ./gradlew :app:assembleAppReleaseRelease

      - name: Release APK must stay within the size budget
        # Per-category compressed bytes and DEX method references against
        # scripts/ci/size-budget.txt (audit 2026-10-13 PERF-04).
        run: bash scripts/ci/check-apk-size.sh

      - name: Release APK must be profileable
        # <profileable android:shell="true"/> survives manifest merging, so
        # Perfetto / Macrobenchmark attach to the shipped build (audit
        # 2026-10-13 PERF-11).
        run: bash scripts/ci/check-apk-profileable.sh

      - name: Release APK must package the app's baseline profile
        # app/src/main/baseline-prof.txt (scripts/perf/update-baseline-profile.sh)
        # with enough app-class rules, compiled into assets/dexopt/ (audit
        # 2026-10-13 PERF-03).
        run: bash scripts/ci/check-baseline-profile.sh

      - name: Verify Log.v/d/i/w stripped from release DEX
        # Enforces proguard-rules.pro's -assumenosideeffects on Log.v/d/i/w on
        # the DEX the release build above produced.
        run: bash scripts/ci/check-dex-logs.sh

      - name: Verify release DEX frames are retraceable
        # Line info kept and every class stamped r8-map-id-<pg_map_id>, so a
        # field crash frame names its mapping.txt (audit 2026-10-06d REL-04).
        run: bash scripts/ci/check-dex-retrace.sh

      - name: No string-named property animators in release app code
        # R8 renamed the drawables' setProgress, so their "progress" animators
        # did nothing in release only (audit 2026-10-06e STAB-02).
        run: bash scripts/ci/check-dex-animators.sh

      - name: Upload R8 mapping
        # Retraces release crash reports (audit 2026-10-06d REL-04). The R8
        # step above wrote build/release-mapping/mapping-<name>-<code>.txt
        # (archiveReleaseMapping in app/build.gradle). The shipped APK is
        # built locally and its own mapping is attached to the GitHub Release;
        # this copy, from the same commit, is the fallback.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r8-mapping
          path: build/release-mapping/
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-release
          path: ./app/build/outputs/apk/

  release-smoke:
    # Installs and runs the minified, signed release build on an x86_64
    # emulator (scripts/ci/smoke-release.sh). The unit tests above run the
    # debug build only; R8 keep-rule mistakes crash only the release build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build signed release with a throwaway key
        # The real signing key never leaves the maintainer's machine; this
        # APK exists only to be run on the emulator below.
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke \
            -keyalg RSA -keysize 2048 -validity 1 -storepass smokepass -keypass smokepass \
            -dname "CN=LRReader CI smoke"
          chmod +x ./gradlew
          RELEASE_STORE_FILE="$RUNNER_TEMP/smoke.jks" RELEASE_STORE_PASSWORD=smokepass \
            RELEASE_KEY_ALIAS=smoke RELEASE_KEY_PASSWORD=smokepass \
            ./gradlew :app:assembleAppReleaseRelease -PsmokeX86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Trace processor for the perf smoke
        # scripts/ci/perf_extract.py reads the Perfetto trace with the
        # `perfetto` package (pinned; it downloads trace_processor_shell).
        run: python3 -m pip install --user perfetto==0.58.2

      - name: Run release smoke and perf measurement on an emulator
        # smoke-release.sh: crash gate through connect → list → detail →
        # reader (mock LANraragi from scripts/ci/mock_lrr.py via adb reverse).
        # smoke-perf.sh: cold start, PSS, list jank, reader trace sections
        # into build/perf/perf.json; check-perf.sh judges it against
        # scripts/ci/perf-budget.txt (record mode warns, gate mode fails).
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash scripts/ci/smoke-release.sh app/build/outputs/apk/appRelease/release/app-appRelease-release.apk
            bash scripts/ci/smoke-perf.sh app/build/outputs/apk/appRelease/release/app-appRelease-release.apk build/perf
            bash scripts/ci/check-perf.sh build/perf/perf.json

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-smoke
          path: build/perf/
          if-no-files-found: ignore
          retention-days: 30

  dependency-submission:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      # Gradle's own action replaces the third-party one that ran with
      # contents: write.
      # Only the shipped APK's runtime classpath: Dependabot alerts then mean
      # "reaches users". Build tooling (AGP, Kotlin plugin, Jetifier) and test
      # classpaths are kept current by plugin bumps; Dependabot cannot update
      # their undeclared transitive deps anyway (security_update_dependency_not_found).
      - name: Dependency Submission
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph-include-configurations: '^appReleaseReleaseRuntimeClasspath$'
