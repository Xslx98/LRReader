// The reader's GL view system, the Scene stack and generic widgets. Knows nothing
// about the app: :app depends on this module, never the other way round.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'jacoco'

android {
    namespace 'com.lanraragi.framework'
    compileSdk 36

    defaultConfig {
        minSdkVersion 28
        consumerProguardFiles 'consumer-rules.pro'
        // Every ABI some :app variant packages; :app's abiFilters pick what ships.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
        testOptions.unitTests.includeAndroidResources = true
        testOptions.unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig false
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError true
        // :app's lint runs on the release path; this module has no release APK.
        checkReleaseBuilds false
        disable 'ExtraTranslation', 'PropertyEscape'
        baseline = file('lint-baseline.xml')
    }
}

detekt {
    config.setFrom("$rootDir/config/detekt/detekt.yml")
    buildUponDefaultConfig = true
    source.setFrom('src/main/java')
    // Per-variant siblings: baseline-framework-debug.xml, -release.xml.
    baseline = file("$rootDir/config/detekt/baseline-framework.xml")
}

// Same test setup as :app: see the comment on its JaCoCo block.
tasks.withType(Test).configureEach {
    maxParallelForks = Math.min(4, Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

dependencies {
    // Public framework classes extend these types, so they are part of its API.
    api libs.core.ktx
    api libs.activity
    api libs.appcompat
    api libs.fragment
    api libs.material
    api libs.preference.ktx
    api libs.recyclerview

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.joor
    testImplementation libs.test.core.ktx
}
